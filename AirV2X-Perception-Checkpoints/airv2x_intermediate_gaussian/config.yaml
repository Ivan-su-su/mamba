active_sensors: &id001
- lidar
bevcam_fov: 110
collaborators: &id002
- vehicle
- rsu
- drone
data_augment:
- ALONG_AXIS_LIST:
  - x
  NAME: random_world_flip
- NAME: random_world_rotation
  WORLD_ROT_ANGLE:
  - -0.78539816
  - 0.78539816
- NAME: random_world_scaling
  WORLD_SCALE_RANGE:
  - 0.95
  - 1.05
device: cuda
dynamic_class: 7
ego_type: vehicle
fusion: #use
  args:
    drone_data_aug_conf: &id003
      H: 720
      W: 1280
      bot_pct_lim:
      - 0.0
      - 0.05
      # final_dim:
      # - 360
      # - 640 -- origin
      final_dim:
      - 256
      - 704
      rand_flip: false
      resize_lim:
      - 0.65
      - 0.7

      rot_lim:
      - -3.6
      - 3.6
    drone_grid_conf: &id004
      ddiscr:
      - 6
      - 150
      - 144
      mode: UD
      xbound:
      - -140.8
      - 140.8
      - 0.4
      ybound:
      - -40
      - 40
      - 0.4
      zbound:
      - -150
      - -6
      - 144
    proj_first: true
    rsu_data_aug_conf: &id005
      H: 720
      W: 1280
      bot_pct_lim:
      - 0.0
      - 0.05
      # final_dim:
      # - 360
      # - 640 -- origin
      final_dim:
      - 256
      - 704
      rand_flip: false
      resize_lim:
      - 0.65
      - 0.7
      resize_lim_mamba:
      - 0.48
      - 0.48
      rot_lim:
      - 0
      - 0
    rsu_grid_conf: &id006
      ddiscr:
      - 2
      - 50
      - 48
      mode: LID
      xbound:
      - -140.8
      - 140.8
      - 0.4
      ybound:
      - -40
      - 40
      - 0.4
      zbound:
      - -30
      - 30
      - 60.0
    veh_data_aug_conf: &id008
      H: 720
      W: 1280
      bot_pct_lim:
      - 0.0
      - 0.05
      # final_dim:
      # - 360
      # - 640 -- origin
      final_dim:
      - 256
      - 704
      rand_flip: false
      resize_lim: #TODO
      - 0.65
      - 0.7
      resize_lim_mamba:
      - 0.48
      - 0.48
      rot_lim:
      - 0
      - 0
    veh_grid_conf: &id009
      ddiscr:
      - 2
      - 50
      - 48
      mode: LID
      xbound:
      - -140.8
      - 140.8
      - 0.4
      ybound:
      - -40
      - 40
      - 0.4
      zbound:
      - -10
      - 10
      - 20.0
  core_method: IntermediateFusionDatasetAirv2x
loss:
  det:
    args:
      cls_weight: 1.0
      num_class: 7
      reg: 2.0
    core_method: point_pillar_loss_multiclass
  seg:
    args:
      d_coe: 2.0
      d_weights:
      - 200.0
      - 200.0
      - 75.0
      - 200.0
      - 200.0
      - 200.0
      l_weights: 8.0
      s_coe: 0.0
      s_weights: 50.0
      seg_branch: both
    core_method: vanilla_seg_loss
lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size:
  - 10
  - 25
  - 40
model:
  args:
    active_sensors: *id001
    anchor_number: 2
    backbone_fix: false
    cav_range: &id014
    - -140.8
    - -40
    - -3
    - 140.8
    - 40
    - 1
    collaborators: *id002
    device: cuda
    drone:
      cam:
        bevout_feature: 64
        camera_encoder: EfficientNet
        data_aug_conf: *id003
        depth_supervision: false
        grid_conf: *id004
        img_downsample: 8
        img_features: 64
        use_depth_gt: true
      lidar:
        backbone_fix: false
        compression: 0
        lidar_range:
        - -140.8
        - -40
        - -150
        - 140.8
        - 40
        - -6
        pillar_vfe:
          num_filters:
          - 64
          use_absolute_xyz: true
          use_norm: true
          with_distance: false
        point_pillar_scatter:
          grid_size: &id007 !!python/object/apply:numpy.core.multiarray._reconstruct
            args:
            - &id010 !!python/name:numpy.ndarray ''
            - !!python/tuple
              - 0
            - !!binary |
              Yg==
            state: !!python/tuple
            - 1
            - !!python/tuple
              - 3
            - &id011 !!python/object/apply:numpy.dtype
              args:
              - i8
              - false
              - true
              state: !!python/tuple
              - 3
              - <
              - null
              - null
              - null
              - -1
              - -1
              - 0
            - false
            - !!binary |
              wAIAAAAAAADIAAAAAAAAAAEAAAAAAAAA
          num_features: 64
        voxel_size:
        - 0.4
        - 0.4
        - 144
      modalities:
      - lidar
    dynamic_class: 7
    ego_type: vehicle
    head_dim: 256
    max_cav: &id016
      drone: 5
      rsu: 5
      vehicle: 5
    num_class: 7
    obj_head: true
    outC: 256
    proj_first: true
    rsu:
      cam:
        bevout_feature: 64
        camera_encoder: EfficientNet
        data_aug_conf: *id005
        depth_supervision: false
        grid_conf: *id006
        img_downsample: 8
        img_features: 64
        use_depth_gt: true
      lidar:
        backbone_fix: false
        compression: 0
        lidar_range:
        - -140.8
        - -40
        - -30
        - 140.8
        - 40
        - 30
        pillar_vfe:
          num_filters:
          - 64
          use_absolute_xyz: true
          use_norm: true
          with_distance: false
        point_pillar_scatter:
          grid_size: *id007
          num_features: 64
        voxel_size:
        - 0.4
        - 0.4
        - 60
      modalities:
      - lidar
    seg_branch: both
    seg_hw: 512
    seg_res: 0.25
    static_class: 3
    supervise_single: false
    task: det
    train: true
    vehicle:
      cam:
        bevout_feature: 64
        camera_encoder: EfficientNet
        data_aug_conf: *id008
        depth_supervision: false
        grid_conf: *id009
        img_downsample: 8
        img_features: 64
        use_depth_gt: true
      lidar:
        backbone_fix: false
        compression: 0
        lidar_range:
        - -140.8
        - -40
        - -3
        - 140.8
        - 40
        - 1
        pillar_vfe:
          num_filters:
          - 64
          use_absolute_xyz: true
          use_norm: true
          with_distance: false
        point_pillar_scatter:
          grid_size: !!python/object/apply:numpy.core.multiarray._reconstruct
            args:
            - *id010
            - !!python/tuple
              - 0
            - !!binary |
              Yg==
            state: !!python/tuple
            - 1
            - !!python/tuple
              - 3
            - *id011
            - false
            - !!binary |
              wAIAAAAAAADIAAAAAAAAAAEAAAAAAAAA
          num_features: 64
        voxel_size:
        - 0.4
        - 0.4
        - 4
      modalities:
      - lidar
    where2com_fusion:
      communication:
        gaussian_smooth:
          c_sigma: 1.0
          k_size: 5
        round: 1
        threshold: 0.01
      downsample_rate: 4
      fully: false
      in_channels: 256
      layer_nums: [3, 5, 8]
      multi_scale: true
      num_filters: [64, 128, 256]
      voxel_size: &id015
      - 0.4
      - 0.4
      - 4

    GRID_SIZE: [704, 200, 16]
    VOXEL_SIZE: [0.4, 0.4, 0.25]
    POINT_CLOUD_RANGE: [-140.8, -40.0, -3, 140.8, 40.0, 1]
    
    BACKBONE_3D:
      NAME:  Gaussian3DBackboneSemantic
      NUM_POINT_FEATURES: 4
      GRID_SIZE: [200, 704, 16]
      VOXEL_SIZE: [0.4, 0.4, 0.25]
      POINT_CLOUD_RANGE: [-140.8, -40.0, -3, 140.8, 40.0, 1]
      VFE:
        NAME: DynamicVoxelVFE
        USE_NORM: True
        WITH_DISTANCE: False
        USE_ABSLOTE_XYZ: True
        NUM_FILTERS: [4, 2]  # 必须 >= [2, 1]，因为非最后一层会 //2，[4,2] 确保第一层输出为 2，第二层输出为 2
        RETURN_ABS_COORDS: False
      BACKBONE_3D:
        NAME: Gaussian3D
        NUM_FEATURES: 2   # 必须与 VFE.NUM_FILTERS[-1] 匹配
        HIDDEN_DIM: 2
        MAX_GAUSSIAN_RATIO: 0.2
        PROJECTION_METHOD: 'scatter_mean'
        USE_GUMBEL: False
        GUMBEL_TEMPERATURE: 0.1
        NUM_CLASSES: 4
        SCALE_RANGE: [0.01, 3.2]

    BACKBONE_2D:
      NAME: GaussianImageBackboneSemantic
      #图像backbone
      IMAGE_BACKBONE: 'SimpleCNN'   #'EfficientNet' or 'ResNet101' or 'SimpleCNN'
      IMAGE_FEATURES: 1
      #TPV配置
      TPV_FEATURES: 1
      TPV_SIZE: [200, 704, 16]
      PC_RANGE: [-140.8, -40.0, -3, 140.8, 40.0, 1]
      VOXEL_SIZE: [0.4, 0.4, 0.25]
      #深度估计
      DEPTH_BINS: 80
      DBOUND: [2.0, 50.0, 0.5]
      TOP_K_DEPTHS: 20
      #语义检测
      MASK_THRESHOLD: 0.3
      USE_SPATIAL_ATTENTION: False
      USE_MORPHOLOGY: False
      NUM_CLASSES: 4
      EMPTY_CLASS_INDEX: 1
      #agent类型
      AGENT_TYPES: ['vehicle', 'rsu', 'drone']
     
      TOPK_PIXELS: 1000
      GAUSSIAN_THRESHOLD: 0.01  # 最小阈值（保底值）
      GAUSSIAN_SCALE_RANGE: [0.01, 3.2]
      # 自适应阈值配置
      USE_ADAPTIVE_THRESHOLD: True  # 是否使用自适应阈值
      TARGET_GAUSSIANS_RATIO: 0.3  # 目标保留比例（30%的候选）
      MIN_GAUSSIANS_PER_CAMERA: 100  # 每个相机最少高斯数
      MAX_GAUSSIANS_PER_CAMERA: 5000  # 每个相机最多高斯数
      
    
    TPVFUSER:
      NAME: ConvFuserTPV1
      IN_CHANNEL: 3  # BACKBONE_2D.TPV_FEATURES (1) + BACKBONE_3D.NUM_FEATURES (2) = 3 (当 use_vmamba=False 时 concat)
      OUT_CHANNEL: 2  # 输出维度，后续模块使用
      AGENT_TYPES: ['vehicle', 'rsu', 'drone']
      MERGE_TYPE: 'default'
      USE_VMAMBA: True   #False
      USE_CHECKPOINT: False   #
      USE_MERGE_AFTER: False
      # VMAMBA 相关配置
      IMAGE_DIM: 1  # 图像分支内通道数（特征维度），必须与 BACKBONE_2D.TPV_FEATURES 匹配
      POINT_DIM: 2  # 点云分支内通道数，必须与 BACKBONE_3D.NUM_FEATURES 匹配
      CROSS_DIM: 2  # 跨模态交互时的中间维度（通常与较大的输入维度匹配）
      MERGE_DIM: 4  # merge_after 时的维度（可以稍大于输入维度）
      DEPTHS: [1, 1, 1]  # VMAMBA 的深度配置
      MAX_CHANNEL: 1  # 最大通道数倍数
      D_STATE: 1  # SSM 状态维度
      SSM_CONV: 3  # SSM 卷积核大小

    REFINER:
      NAME: GaussianTPVRefinerSemantic
      FEATURE_DIM: 1  # 高斯特征维度（来自 backbone_2d 和 backbone_3d）
      TPV_FEATURE_DIM: 2  # 必须与 TPVFUSER.OUT_CHANNEL 匹配
      EMBED_DIMS: 2   # 内部嵌入维度
      NUM_HEADS: 1
      NUM_LAYERS: 3
      K_NEIGHBORS: 16
      PC_RANGE: [-140.8, -40.0, -3, 140.8, 40.0, 1]
      NUM_POINTS: 5
      NUM_LEARNABLE_PTS: 0
      MAX_DISTANCE: 10.0
      SCALE_RANGE: [0.01, 3.2]
      UNIT_XYZ: [4.0, 4.0, 2.0]
      DROPOUT: 0.1

    AGENT_FUSER:
      NAME: AgentFuser
      IN_CHANNEL: 2  # 必须与 TPVFUSER.OUT_CHANNEL 匹配
      OUT_CHANNEL: 2  # 输出维度，传递给 GAUSSIAN2BEV
      AGENT_TYPES: ['vehicle', 'rsu', 'drone']
      FUSION_METHOD: 'default'
      TPV_PLANES: ['xy', 'xz', 'yz']
      AGENT_EMBED_DIM: 8
      USE_AGENT_EMBED: True
      AGENT_EMBED_TYPE: 'camera'   # 'index' | 'camera' | 'both'
      CAMERA_EMBED_HIDDEN: 16
      CONFIDENCE_MAP: {
        HIDDEN_DIM: 16
      }

    GAUSSIAN2BEV:
      NAME: GaussianToBEVSemantic
      FEATURE_DIM: 2  # 必须与 REFINER.EMBED_DIMS 匹配（高斯特征维度）
      OUTPUT_FEATURE_DIM: 2  # 最终输出到检测头的特征维度（FUSE_MODE='add' 时等于 FEATURE_DIM）
      USE_NEIGHBOR_ASSOCIATION: True
      USE_REFINEMENT: True
      AGGREGATION: 'mean'
      QUAT_POOLING: 'antipodal'
      RETURN_ABS_HEIGHT: True
      USE_MAHALANOBIS_DISTANCE: True
      TEMPERATURE: 1.0
      NORMALIZE_WEIGHTS: True
      CHUNK: 4096
      SCALE_MULTIPLIER: 3.0
      MAX_NEIGHBORS: 64
      ASSOC_CHUNK: 4096
      AGGREGATION_METHOD: 'mean'
      Z_BINS: 20
      HEIGHT_EMBED_DIM: 1
      FUSE_MODE: 'add'  # 使用 'add' 以保持输出维度为 FEATURE_DIM=2，避免 concat 增加维度到 3
      VOXEL_SIZE: [0.4, 0.4, 0.25]
      GRID_SIZE: [704, 200, 16]
      POINT_CLOUD_RANGE: [-140.8, -40.0, -3, 140.8, 40.0, 1]
  core_method: airv2x_gaussian
name: airv2x_intermediate_gaussian
num_anchor: 2
num_class: 7
optimizer:
  args:
    eps: 1.0e-10
    weight_decay: 0.0001
  core_method: Adam
  lr: 0.002
postprocess: #use
  anchor_args:
    D: 1
    H: 200
    W: 704
    cav_lidar_range: *id014
    feature_stride: 2
    h: 1.56
    l: 3.9
    num: 2
    r:
    - 0
    - 90
    vd: 4
    vh: 0.4
    vw: 0.4
    w: 1.6
  core_method: VoxelPostprocessor
  ego_type: vehicle
  max_num: 300
  nms_thresh: 0.15
  order: hwl
  target_args:
    neg_threshold: 0.45
    obj_threshold: 0.2
    pos_threshold: 0.6
    score_threshold: 0.2
preprocess:
  args:
    max_points_per_voxel: 32
    max_voxel_test: 70000
    max_voxel_train: 32000
    voxel_size: *id015
  cav_lidar_range: *id014
  core_method: SpVoxelPreprocessor
  ego_type: vehicle
root_dir: /home/chubin/suyi/dataset/AirV2X-Perception/train/train
seg_branch: both
seg_hw: 512
seg_res: 0.25
static_class: 3
tag: default
task: det
train: true
train_params:
  batch_size: 1
  epoches: 50
  eval_freq: 2
  max_cav: *id016
  save_freq: 1
validate_dir: /home/chubin/suyi/dataset/AirV2X-Perception/val/val #use
test_dir: /home/chubin/suyi/dataset/AirV2X-Perception/test/test #use
yaml_parser: load_airv2x_params
visualize: True #use
